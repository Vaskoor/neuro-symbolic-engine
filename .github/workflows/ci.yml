# =============================================================================
# CI — lint, test, smoke
# =============================================================================
name: CI

# NOTE: the "on" key is quoted on purpose. YAML 1.1 parses the bare token `on`
#       as a boolean (true), which silently disables the workflow. Quoting it
#       as `"on":` is the standard GitHub-Actions workaround.
"on":
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ---------------------------------------------------------------------------
  # 1. Lint — ruff check + format check
  # ---------------------------------------------------------------------------
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff
      - name: ruff check
        run: ruff check src/ tests/
      - name: ruff format --check
        run: ruff format --check src/ tests/

  # ---------------------------------------------------------------------------
  # 2. Test — pytest, matrix across 3.11 / 3.12
  # ---------------------------------------------------------------------------
  test:
    name: Test (pytest, py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Run tests
        run: pytest tests/ -v --tb=short
        env:
          NEUROSYM_OFFLINE: "1"
          NEUROSYM_LLM_ENABLED: "0"

  # ---------------------------------------------------------------------------
  # 3. Smoke — load ontology + forward-chain + query
  # ---------------------------------------------------------------------------
  smoke:
    name: Smoke (ontology + datalog + query)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Load ontology + forward-chain + query
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "src")
          # Import `neurosym.core` first to avoid a circular-import issue
          # between `neurosym.core.__init__` (which imports `.engine` last)
          # and `neurosym.knowledge.datalog` (which imports `..core.types`).
          import neurosym.core  # noqa: F401

          from neurosym.knowledge.graph import KnowledgeGraph
          from neurosym.knowledge.datalog import DatalogEngine
          from neurosym.core.types import Triple

          kg = KnowledgeGraph()
          kg.load_turtle("config/ontology.ttl")
          print(f"KG triples loaded: {len(kg)}")

          dl = DatalogEngine(seed=42)
          # Seed the Datalog fact table from the KG.
          dl.set_facts([
              Triple(s=row["s"], p=row["p"], o=row["o"])
              for row in kg.get_triples()
          ])
          n_rules = dl.load_rules("config/rules.yaml")
          print(f"Rules loaded: {n_rules}")

          # Add some synthetic instance data so the rules can fire.
          dl.add_facts([
              Triple(s="ex:P_smoke", p="ex:authoredBy", o="ex:R_smoke"),
              Triple(s="ex:R_smoke", p="ex:affiliatedWith", o="ex:I_smoke"),
          ])
          derived = dl.forward_chain()
          print(f"Derived facts: {len(derived)}")
          assert any(
              t.s == "ex:P_smoke" and t.p == "ex:hasInstitution" and t.o == "ex:I_smoke"
              for t in derived
          ), "expected derive_has_institution to fire"

          # Query for a known schema-level entity class.
          rows = kg.sparql_query(
              "SELECT ?s WHERE { ?s a <http://www.w3.org/2002/07/owl#Class> } LIMIT 5"
          )
          print(f"Classes returned by SPARQL: {len(rows)}")

          print("SMOKE OK")
          PY
        env:
          NEUROSYM_OFFLINE: "1"
